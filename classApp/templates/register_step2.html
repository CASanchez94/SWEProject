{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Classes - Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-lg" style="width: 100%; max-width: 500px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
                    </div>
                    <h2 class="text-success mb-2">Account Successfully Created!</h2>
                    <p class="text-muted">Welcome, {{ user.first_name }}! Let's get you started.</p>
                </div>

                <hr class="my-4">

                <h5 class="mb-3 text-secondary">Add Your Classes (Optional)</h5>
                <p class="text-muted small mb-4">Select any classes you're currently enrolled in. You can always update this later.</p>

                <form method="post" id="classesForm">
                    {% csrf_token %}
                    <input type="hidden" name="class_count" id="class_count" value="{{ class_forms|length }}">

                    <div id="classRows"></div>
                    
                    <div class="d-flex justify-content-center mb-4">
                        <button type="button" class="btn btn-primary btn-lg rounded-pill shadow-sm px-5" id="addClassRow">
                            + Add Class
                        </button>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">Continue</button>
                        <a href="{% url 'login' %}" class="btn btn-outline-secondary">Skip for now</a>
                    </div>
                </form>

                <script>
                    (function() {
                        const classRows = document.getElementById('classRows');
                        const classCount = document.getElementById('class_count');
                        const addButton = document.getElementById('addClassRow');

                        function updateCount(value) {
                            classCount.value = value;
                        }

                        function createClassRow(index) {
                            const row = document.createElement('div');
                            row.className = 'row g-3 mb-3 align-items-end class-row';
                            row.dataset.index = index;
                            row.innerHTML = `
                                <div class="col-5">
                                    <label class="form-label fw-semibold" for="id_class_${index}-subject">Subject</label>
                                    <input type="text" name="class_${index}-subject" id="id_class_${index}-subject" class="form-control form-control-lg rounded-3" placeholder="e.g. CSCI or Software Engineering">
                                </div>
                                <div class="col-5">
                                    <label class="form-label fw-semibold" for="id_class_${index}-section_number">Section Number</label>
                                    <input type="text" name="class_${index}-section_number" id="id_class_${index}-section_number" class="form-control form-control-lg rounded-3" placeholder="e.g. 3340 or 01">
                                </div>
                                <div class="col-2 d-flex align-items-end">
                                    <button type="button" class="btn btn-outline-danger btn-sm remove-class-row">Remove</button>
                                </div>
                            `;
                            return row;
                        }

                        function addRow() {
                            const nextIndex = parseInt(classCount.value, 10);
                            classRows.appendChild(createClassRow(nextIndex));
                            updateCount(nextIndex + 1);
                        }

                        function removeRow(button) {
                            const row = button.closest('.class-row');
                            if (!row) return;
                            row.remove();
                            const remainingRows = classRows.querySelectorAll('.class-row');
                            updateCount(remainingRows.length);
                            remainingRows.forEach((rowEl, idx) => {
                                rowEl.dataset.index = idx;
                                const subject = rowEl.querySelector('[name^="class_"][name$="-subject"]');
                                const section = rowEl.querySelector('[name^="class_"][name$="-section_number"]');
                                const subjectLabel = rowEl.querySelector('label[for]');
                                const sectionLabel = rowEl.querySelectorAll('label[for]')[1];
                                if (subject) {
                                    subject.name = `class_${idx}-subject`;
                                    subject.id = `id_class_${idx}-subject`;
                                }
                                if (section) {
                                    section.name = `class_${idx}-section_number`;
                                    section.id = `id_class_${idx}-section_number`;
                                }
                                if (subjectLabel) {
                                    subjectLabel.htmlFor = `id_class_${idx}-subject`;
                                }
                                if (sectionLabel) {
                                    sectionLabel.htmlFor = `id_class_${idx}-section_number`;
                                }
                            });
                        }

                        addButton.addEventListener('click', addRow);

                        classRows.addEventListener('click', function(event) {
                            if (event.target.matches('.remove-class-row')) {
                                removeRow(event.target);
                            }
                        });
                    })();
                </script>
            </div>
        </div>
    </div>
</body>
</html>
